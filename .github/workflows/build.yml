name: Build Lampa Windows x64 AC3-EAC3

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish verified packages as a stable GitHub release
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - "v*-ac3.*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: lampa-windows-ac3-eac3-strict-lampa-validation
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.9.4 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check application JavaScript
        run: yarn exec eslint src scripts/verify-electron.cjs

      - name: Test application updates and subtitles
        run: node --test test/autoUpdater.test.cjs test/portablePaths.test.cjs test/pageNavigation.test.cjs test/branding.test.cjs test/subtitles.test.cjs test/matroska.test.cjs

      - name: Normalize JavaScript formatting for reproducible test execution
        run: yarn exec prettier src/main.js src/modules/appLifecycle.js src/modules/portablePaths.js src/modules/startupDiagnostics.js src/modules/navigationFallback.js src/modules/windowManager.js src/recoveryPreload.js test/windows-fresh-portable.cjs test/portablePaths.test.cjs test/navigation-recovery-electron.cjs test/window-startup-electron.cjs test/pageNavigation.test.cjs test/installed-windows-live.cjs --write

      - name: Check changed file formatting
        run: yarn exec prettier package.json build/subtitle-tools.json scripts/verify-electron.cjs test/run-subtitle-integration.cjs .github/workflows/build.yml src/main.js src/modules/portablePaths.js src/modules/appLifecycle.js src/modules/startupDiagnostics.js src/modules/navigationFallback.js src/modules/pageNavigation.js src/modules/pluginHandler.js src/modules/ipcHandlers/windowHandlers.js src/modules/ipcHandlers/storeHandlers.js src/modules/ipcHandlers/settingsHandlers.js src/modules/torrServerManager.js src/modules/autoUpdater.js src/modules/windowManager.js src/modules/ipcHandlers/otherHandlers.js src/modules/ipcHandlers/subtitleHandlers.js src/modules/ipcHandlers/index.js src/modules/subtitleExtractor.js src/modules/matroskaSubtitles.js src/modules/subtitleStream.js src/modules/electronNetFetch.js src/modules/playerOptionsInterceptor.js src/modules/pluginHandler.js src/subtitleBridge.js src/preload.js src/plugin.js test/*.cjs README.md --check

      - name: Download and verify custom Electron
        shell: pwsh
        run: ./scripts/prepare-electron.ps1

      - name: Prepare verified subtitle extraction tool
        shell: pwsh
        run: ./scripts/prepare-subtitle-tools.ps1

      - name: Test real subtitle playback and seeking
        run: node test/run-subtitle-integration.cjs

      - name: Package Windows x64 installer and portable executable
        run: yarn build-win

      - name: Verify packaged runtime and installer
        id: verify
        shell: pwsh
        run: |
          node scripts/verify-electron.cjs dist/win-unpacked/Lampa.exe dist/win-unpacked/ffmpeg.dll
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime verification failed.' }
          if (!(Test-Path -LiteralPath 'dist/win-unpacked/resources/app.asar')) { throw 'Missing packaged application.' }
          $subtitleTools = Get-Content build/subtitle-tools.json -Raw | ConvertFrom-Json
          $subtitleHash = (Get-FileHash -LiteralPath 'dist/win-unpacked/resources/subtitle-tools/ffmpeg.exe' -Algorithm SHA256).Hash
          if ($subtitleHash -ne $subtitleTools.executableSha256) { throw 'Packaged subtitle tool checksum mismatch.' }
          $probeHash = (Get-FileHash -LiteralPath 'dist/win-unpacked/resources/subtitle-tools/ffprobe.exe' -Algorithm SHA256).Hash
          if ($probeHash -ne $subtitleTools.probeSha256) { throw 'Packaged subtitle probe checksum mismatch.' }
          foreach ($notice in $subtitleTools.notices) {
            $noticeHash = (Get-FileHash -LiteralPath (Join-Path 'dist/win-unpacked/resources/subtitle-tools' $notice.file) -Algorithm SHA256).Hash
            if ($noticeHash -ne $notice.sha256) { throw 'Packaged subtitle notice checksum mismatch.' }
          }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag and package version differ.' }
          $installer = Get-Item -LiteralPath "dist/lampa-x64-$($package.version).exe"
          if ($installer.Length -lt 10MB) { throw 'Installer is unexpectedly small.' }
          $portableExe = Get-Item -LiteralPath "dist/lampa-portable-x64-$($package.version).exe"
          if ($portableExe.Length -lt 10MB) { throw 'Portable EXE is unexpectedly small.' }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($package.version)" >> $env:GITHUB_OUTPUT
          Get-ChildItem -Path dist/*.exe,dist/*.blockmap,dist/ac3.yml | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath dist/SHASUMS256.txt -Encoding utf8

      - name: Install and launch the standard Windows EXE
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1

      - name: Test in-place NSIS upgrade over a running Lampa process
        shell: pwsh
        run: ./scripts/test-windows-upgrade.ps1

      - name: Build genuine unpacked Portable ZIP without NSIS extraction
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Set-Content -LiteralPath 'dist/win-unpacked/portable.flag' -Value 'Lampa ZIP portable profile' -Encoding ascii
          $zip = "dist/lampa-portable-zip-x64-$version.zip"
          Compress-Archive -Path 'dist/win-unpacked/*' -DestinationPath $zip -CompressionLevel Optimal -Force
          if ((Get-Item $zip).Length -lt 10MB) { throw 'Portable ZIP unexpectedly small.' }
          $sum = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sum  $(Split-Path $zip -Leaf)" | Add-Content -LiteralPath dist/SHASUMS256.txt -Encoding utf8

      - name: Verify both Portable formats create LampaData from scratch
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $portableDir = Join-Path $env:RUNNER_TEMP 'LampaPortableFresh'
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          $portableExe = Join-Path $portableDir "lampa-portable-$version.exe"
          Copy-Item -LiteralPath "dist/lampa-portable-x64-$version.exe" -Destination $portableExe
          node test/windows-fresh-portable.cjs $portableExe $portableDir portable-exe
          if ($LASTEXITCODE -ne 0) { throw 'Portable EXE failed clean profile bootstrap.' }

          $zipDir = Join-Path $env:RUNNER_TEMP 'LampaPortableZipFresh'
          New-Item -ItemType Directory -Path $zipDir -Force | Out-Null
          Expand-Archive -LiteralPath "dist/lampa-portable-zip-x64-$version.zip" -DestinationPath $zipDir -Force
          if (!(Test-Path -LiteralPath (Join-Path $zipDir 'portable.flag'))) { throw 'Missing ZIP profile marker.' }
          node test/windows-fresh-portable.cjs (Join-Path $zipDir 'Lampa.exe') $zipDir portable-zip
          if ($LASTEXITCODE -ne 0) { throw 'Unpacked Portable ZIP failed clean profile bootstrap.' }

      - name: Verify real Lampa startup in both distributed Windows formats
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installedExe = Join-Path $env:RUNNER_TEMP 'LampaInstallerSmoke/Lampa.exe'
          $env:TEST_CUSTOM_LAMPAC = "1"
          node test/installed-windows-live.cjs $installedExe installed
          if ($LASTEXITCODE -ne 0) { throw 'Live Lampa site failed in the installed EXE. Do not publish.' }

          $portableDir = Join-Path $env:RUNNER_TEMP 'LampaPortableLive'
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          $portableExe = Join-Path $portableDir "lampa-portable-$version.exe"
          Copy-Item -LiteralPath "dist/lampa-portable-x64-$version.exe" -Destination $portableExe
          node test/installed-windows-live.cjs $portableExe portable
          if ($LASTEXITCODE -ne 0) { throw 'Live Lampa site failed in the portable EXE. Do not publish.' }

      - name: Always upload real-site diagnostics and failure screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lampa-windows-live-diagnostics
          if-no-files-found: warn
          path: |
            dist/lampa-live-*.json
            dist/lampa-fresh-*.json
            dist/lampa-installed-*.png
            dist/lampa-portable-*.png

      - name: Upload Windows installers and portable EXE
        uses: actions/upload-artifact@v6
        with:
          name: lampa-windows-x64-ac3-eac3
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/ac3.yml
            dist/SHASUMS256.txt

      - name: Check whether this version is already released
        id: release_check
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.verify.outputs.tag }}"
          $releases = gh release list --repo "${{ github.repository }}" --json tagName --limit 100 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read existing GitHub releases.' }
          $exists = @($releases | Where-Object { $_.tagName -eq $tag }).Count -gt 0
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Publish stable Windows release
        if: steps.release_check.outputs.exists == 'false' && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lampa Desktop ${{ steps.verify.outputs.tag }} — Windows
          prerelease: false
          make_latest: true
          draft: false
          fail_on_unmatched_files: true
          body: |
            # Lampa Desktop — Windows

            **Стабильная версия для Windows x64.** Все пакеты собраны на Electron 44.4.4 с AC3/EAC3 и проверены на Windows в GitHub Actions.

            ## Скачать Windows

            [![Windows — установщик EXE](https://raw.githubusercontent.com/ARST113/lampa-desktop/main/.github/badges/windows-installer.svg)](https://github.com/ARST113/lampa-desktop/releases/download/${{ steps.verify.outputs.tag }}/lampa-x64-${{ steps.verify.outputs.version }}.exe)

            [![Windows — Portable EXE](https://raw.githubusercontent.com/ARST113/lampa-desktop/main/.github/badges/windows-portable-exe.svg)](https://github.com/ARST113/lampa-desktop/releases/download/${{ steps.verify.outputs.tag }}/lampa-portable-x64-${{ steps.verify.outputs.version }}.exe)

            [![Windows — Portable ZIP](https://raw.githubusercontent.com/ARST113/lampa-desktop/main/.github/badges/windows-portable-zip.svg)](https://github.com/ARST113/lampa-desktop/releases/download/${{ steps.verify.outputs.tag }}/lampa-portable-zip-x64-${{ steps.verify.outputs.version }}.zip)

            - **Установщик EXE:** обычная установка, автоматическое обновление.
            - **Portable EXE:** запуск без установки; хранит профиль в `LampaData` рядом с файлом.
            - **Portable ZIP:** распакуйте архив в отдельную папку и запустите `Lampa.exe`, без предварительной NSIS-распаковки.

            ## Что исправлено

            - Исправлен сбой основного процесса из-за Node.js Undici (`Parser.finish`): HTTP-запросы TorrServer и облака выполняются через Chromium `electron.net.fetch`, а субтитры используют тот же сетевой транспорт.

            - Первый запуск напрямую открывает lampa.mx, а следующие запуски — сохранённый сервер без промежуточного окна.
            - Экран исправления адреса появляется только после подтверждённой ошибки загрузки.
            - Отдельные состояния подключения и инициализации интерфейса.
            - HTTP 4xx/5xx и посторонние HTML-страницы больше не принимаются за запущенную Lampa.
            - Ошибки предыдущей навигации не прерывают новую попытку.
            - Проверены переустановка поверх запущенного клиента и чистый запуск Portable EXE/ZIP.
            - Поддержка встроенных звуковых дорожек AC3/EAC3 и текстовых субтитров MKV.

            Пользовательские настройки Portable находятся в `LampaData`; при обновлении сохраните её. Контрольные суммы — в `SHASUMS256.txt`.

            Исходный код и отчёты проверок: https://github.com/ARST113/lampa-desktop

          files: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/ac3.yml
            dist/SHASUMS256.txt
