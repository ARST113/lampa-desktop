name: Build Lampa Windows x64 AC3-EAC3

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified installer to a GitHub prerelease
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - "v*-ac3.*"

permissions:
  contents: write

concurrency:
  group: lampa-windows-ac3-eac3-ac314-onboarding
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.9.4 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check application JavaScript
        run: yarn exec eslint src scripts/verify-electron.cjs

      - name: Test application updates and subtitles
        run: node --test test/autoUpdater.test.cjs test/portablePaths.test.cjs test/pageNavigation.test.cjs test/branding.test.cjs test/subtitles.test.cjs test/matroska.test.cjs

      - name: Normalize JavaScript formatting for reproducible test execution
        run: yarn exec prettier src/main.js src/modules/appLifecycle.js src/modules/portablePaths.js src/modules/startupDiagnostics.js src/modules/navigationFallback.js src/modules/windowManager.js test/windows-fresh-portable.cjs test/portablePaths.test.cjs test/navigation-recovery-electron.cjs test/pageNavigation.test.cjs test/installed-windows-live.cjs --write

      - name: Check changed file formatting
        run: yarn exec prettier package.json build/subtitle-tools.json scripts/verify-electron.cjs test/run-subtitle-integration.cjs .github/workflows/build.yml src/main.js src/modules/portablePaths.js src/modules/appLifecycle.js src/modules/startupDiagnostics.js src/modules/navigationFallback.js src/modules/pageNavigation.js src/modules/pluginHandler.js src/modules/ipcHandlers/windowHandlers.js src/modules/ipcHandlers/storeHandlers.js src/modules/ipcHandlers/settingsHandlers.js src/modules/torrServerManager.js src/modules/autoUpdater.js src/modules/windowManager.js src/modules/ipcHandlers/otherHandlers.js src/modules/ipcHandlers/subtitleHandlers.js src/modules/ipcHandlers/index.js src/modules/subtitleExtractor.js src/modules/matroskaSubtitles.js src/modules/subtitleStream.js src/modules/playerOptionsInterceptor.js src/modules/pluginHandler.js src/subtitleBridge.js src/preload.js src/plugin.js test/*.cjs README.md --check

      - name: Download and verify custom Electron
        shell: pwsh
        run: ./scripts/prepare-electron.ps1

      - name: Prepare verified subtitle extraction tool
        shell: pwsh
        run: ./scripts/prepare-subtitle-tools.ps1

      - name: Test real subtitle playback and seeking
        run: node test/run-subtitle-integration.cjs

      - name: Package Windows x64 installer and portable executable
        run: yarn build-win

      - name: Verify packaged runtime and installer
        id: verify
        shell: pwsh
        run: |
          node scripts/verify-electron.cjs dist/win-unpacked/Lampa.exe dist/win-unpacked/ffmpeg.dll
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime verification failed.' }
          if (!(Test-Path -LiteralPath 'dist/win-unpacked/resources/app.asar')) { throw 'Missing packaged application.' }
          $subtitleTools = Get-Content build/subtitle-tools.json -Raw | ConvertFrom-Json
          $subtitleHash = (Get-FileHash -LiteralPath 'dist/win-unpacked/resources/subtitle-tools/ffmpeg.exe' -Algorithm SHA256).Hash
          if ($subtitleHash -ne $subtitleTools.executableSha256) { throw 'Packaged subtitle tool checksum mismatch.' }
          $probeHash = (Get-FileHash -LiteralPath 'dist/win-unpacked/resources/subtitle-tools/ffprobe.exe' -Algorithm SHA256).Hash
          if ($probeHash -ne $subtitleTools.probeSha256) { throw 'Packaged subtitle probe checksum mismatch.' }
          foreach ($notice in $subtitleTools.notices) {
            $noticeHash = (Get-FileHash -LiteralPath (Join-Path 'dist/win-unpacked/resources/subtitle-tools' $notice.file) -Algorithm SHA256).Hash
            if ($noticeHash -ne $notice.sha256) { throw 'Packaged subtitle notice checksum mismatch.' }
          }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag and package version differ.' }
          $installer = Get-Item -LiteralPath "dist/lampa-x64-$($package.version).exe"
          if ($installer.Length -lt 10MB) { throw 'Installer is unexpectedly small.' }
          $portableExe = Get-Item -LiteralPath "dist/lampa-portable-x64-$($package.version).exe"
          if ($portableExe.Length -lt 10MB) { throw 'Portable EXE is unexpectedly small.' }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          Get-ChildItem -Path dist/*.exe,dist/*.blockmap,dist/ac3.yml | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath dist/SHASUMS256.txt -Encoding utf8

      - name: Install and launch the standard Windows EXE
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1

      - name: Test in-place NSIS upgrade over a running Lampa process
        shell: pwsh
        run: ./scripts/test-windows-upgrade.ps1

      - name: Build genuine unpacked Portable ZIP without NSIS extraction
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Set-Content -LiteralPath 'dist/win-unpacked/portable.flag' -Value 'Lampa ZIP portable profile' -Encoding ascii
          $zip = "dist/lampa-portable-zip-x64-$version.zip"
          Compress-Archive -Path 'dist/win-unpacked/*' -DestinationPath $zip -CompressionLevel Optimal -Force
          if ((Get-Item $zip).Length -lt 10MB) { throw 'Portable ZIP unexpectedly small.' }
          $sum = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sum  $(Split-Path $zip -Leaf)" | Add-Content -LiteralPath dist/SHASUMS256.txt -Encoding utf8

      - name: Verify both Portable formats create LampaData from scratch
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $portableDir = Join-Path $env:RUNNER_TEMP 'LampaPortableFresh'
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          $portableExe = Join-Path $portableDir "lampa-portable-$version.exe"
          Copy-Item -LiteralPath "dist/lampa-portable-x64-$version.exe" -Destination $portableExe
          node test/windows-fresh-portable.cjs $portableExe $portableDir portable-exe
          if ($LASTEXITCODE -ne 0) { throw 'Portable EXE failed clean profile bootstrap.' }

          $zipDir = Join-Path $env:RUNNER_TEMP 'LampaPortableZipFresh'
          New-Item -ItemType Directory -Path $zipDir -Force | Out-Null
          Expand-Archive -LiteralPath "dist/lampa-portable-zip-x64-$version.zip" -DestinationPath $zipDir -Force
          if (!(Test-Path -LiteralPath (Join-Path $zipDir 'portable.flag'))) { throw 'Missing ZIP profile marker.' }
          node test/windows-fresh-portable.cjs (Join-Path $zipDir 'Lampa.exe') $zipDir portable-zip
          if ($LASTEXITCODE -ne 0) { throw 'Unpacked Portable ZIP failed clean profile bootstrap.' }

      - name: Verify real Lampa startup in both distributed Windows formats
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installedExe = Join-Path $env:RUNNER_TEMP 'LampaInstallerSmoke/Lampa.exe'
          node test/installed-windows-live.cjs $installedExe installed
          if ($LASTEXITCODE -ne 0) { throw 'Live Lampa site failed in the installed EXE. Do not publish.' }

          $portableDir = Join-Path $env:RUNNER_TEMP 'LampaPortableLive'
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          $portableExe = Join-Path $portableDir "lampa-portable-$version.exe"
          Copy-Item -LiteralPath "dist/lampa-portable-x64-$version.exe" -Destination $portableExe
          node test/installed-windows-live.cjs $portableExe portable
          if ($LASTEXITCODE -ne 0) { throw 'Live Lampa site failed in the portable EXE. Do not publish.' }

      - name: Always upload real-site diagnostics and failure screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lampa-windows-live-diagnostics
          if-no-files-found: warn
          path: |
            dist/lampa-live-*.json
            dist/lampa-fresh-*.json
            dist/lampa-installed-*.png
            dist/lampa-portable-*.png

      - name: Upload Windows installers and portable EXE
        uses: actions/upload-artifact@v6
        with:
          name: lampa-windows-x64-ac3-eac3
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/ac3.yml
            dist/SHASUMS256.txt

      - name: Publish verified installer
        if: github.event_name == 'push' || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lampa ${{ steps.verify.outputs.tag }} — Windows x64 AC3/EAC3 + Portable
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            New in ac3.18: reduce the one-shot Lampa readiness limit from
            12 seconds to 3 seconds. Valid sites were verified through
            cold-start and repeated navigation tests in Windows installer,
            Portable EXE and unpacked Portable ZIP. Connection refusal still
            opens the URL correction form immediately without retries.

            New in ac3.17: try a configured URL only ONCE. On first
            network or interface failure, immediately show a local,
            Android-style URL correction panel with the failed URL, a
            single Retry action and an explicit Open lampa.mx button.
            Remove automatic host switching and all retry cascades.
            Display the Windows window immediately with a loading title,
            and cap unavailable site startup at 12 seconds. Real Windows
            tests now require the correction panel after one failure
            and manual recovery within the same EXE process for
            installed and portable distributions.

            New in ac3.16: add an actual unpacked Windows Portable ZIP that
            launches directly without NSIS extraction. Portable EXE and ZIP
            must each create LampaData from scratch and open real Lampa in
            Windows CI. Early errors write %LOCALAPPDATA%/Lampa-NextGen/
            diagnostics/startup.log and display an error dialog. Fix hidden
            single-instance startup and allow NSIS installer to close the app
            promptly when TorrServer is not running.

            New in ac3.15: interactive local recovery page instead of a blocking
            native error dialog after failures of both official endpoints.
            Portable config.json is watched for external URL edits while running.
            Avoid duplicate navigation and preserve the user's corrected URL
            during an in-flight failure. Windows CI verifies repeated invalid
            then valid URL changes inside the SAME running installed and portable
            process, including external config.json edits and offline recovery.

            New in ac3.14: fix Electron hidden-window false startup failures and
            disable background throttling, and recognize Lampa's first-run
            language chooser as a successfully loaded interactive screen. Try the official HTTPS fallback only
            if http://lampa.mx is truly unavailable. Installed and portable
            Windows EXEs must now pass three live-site launch scenarios each,
            including config.json edits and automatic invalid-URL recovery,
            before any release is published. Failure screenshots and diagnostic
            JSON are attached to the CI workflow run.

            New in ac3.13: fixes two competing Lampa URL navigations from
            store.onDidChange and the automatic fallback controller. All
            settings changes now navigate once, via the controller. The app
            waits for Lampa appready and visible UI structure before showing
            the window, rather than accepting a partially loaded JS global.
            Electron tests exercise changes via the actual settings IPC,
            including typo fallback, then entering a valid URL.

            New in ac3.12: invalid, unreachable or blank custom addresses
            automatically fall back to http://lampa.mx and reset the saved URL.
            The main window is hidden during startup to avoid a white screen.
            If even the default cannot load, a native Retry or Exit dialog appears.

            New in ac3.11: Windows ZIP variant removed. Retains only portable EXE and NSIS installer.
            Each release now runs the silent NSIS installer and opens its actual Lampa.exe
            with a clean profile against a deterministic local HTTP page before publication.

            Windows x64 build of Lampa Desktop using custom Electron 44.4.4 with AC3/EAC3 build flags.

            Enables embedded audio-track switching in the internal player, including torrents played through TorrServer.
            Adds App settings → Check for updates, with background downloads and installation after confirmation.

            New in ac3.10: fixes blank screens on failed URLs with a standalone error page,
            restores URL switching from that page, and permits same-site navigation.
            The Windows CI now exercises network failure and recovery in real Electron.

            New in ac3.9: removes the original developer donation menu, embedded payment QR codes,
            and Robokassa payment URLs from all Windows builds. About now links to the ARST113 fork
            and checks this fork's latest release (including prereleases).
            The original GPL license and source attribution remain available in the repository.

            New in ac3.7: fixes subtitles disappearing when Lampa changes its in-page history/hash route while playback continues.
            The subtitle subscription now stays active until the player closes or the document actually changes.
            Reads embedded text subtitle packets directly from the MKV bytes already fetched by the video player.
            Already buffered languages switch immediately without launching FFmpeg or a second media download.
            On a seek into a long caption, uses the MKV subtitle index for a bounded byte-range lookup. Files without a subtitle index resume captions from the next received packet.
            Opens developer tools with F12, Ctrl+Shift+I, or App settings → Open console.
            Supports embedded MKV text subtitles (SRT, ASS/SSA, WebVTT) in the internal player through TorrServer, including compatibility with Lampac Tracks menus.
            Discovers subtitle tracks from the MKV header, independently of TorrServer FFprobe metadata.
            Supports language switching, seeking and disabling subtitles. Video and audio are not transcoded.
            Graphical PGS/VobSub tracks are unsupported by this reader; complex ASS styling is converted to WebVTT text.

            Based on Kolovatoff/lampa-desktop. Updates for this build use ARST113/lampa-desktop.
            Runtime: https://github.com/ARST113/electron/releases/tag/v44.4.4-ac3-eac3
            The build verifies the NSIS installation and real app startup, packaged Electron version and unchanged custom ffmpeg.dll.

            Windows download choices:
            - `lampa-portable-x64-*.exe` — standalone portable launcher, no installation.
            - `lampa-x64-*.exe` — standard NSIS installer, checked by actual installation and launch.

            Portable settings, Chromium profile, and TorrServer data are stored in the LampaData
            directory next to the portable EXE. Keep this directory when replacing the portable EXE.
            Portable EXE uses manual application updates; installed EXE supports automatic updates.
            SHA-256 checksums are in SHASUMS256.txt.
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/ac3.yml
            dist/SHASUMS256.txt
