name: Live TorrServer 4K Stream Regression

# Does not download whole torrents or require a local Windows/ATV player.
# First-run PR branch performs live checks; subsequent runs use workflow_dispatch.
on:
  push:
    branches:
      - main
      - test/real-torrserver-streams
    paths:
      - ".github/workflows/live-torrserver-regression.yml"
      - "test/live-torrserver-electron.cjs"
      - "test/run-live-torrserver.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-torrserver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-electron-streams:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      LIVE_MUTINY_MASTER5: "http://213.171.26.189:2367/stream/Mutiny.2026.2160p.WEB-DL.HDR.H265.Master5.mkv?link=6eea6e56f897fefa49f835726c6da09ed8e56ec2&index=1&play"
      LIVE_MUTINY_AC3: "http://213.171.26.189:2367/stream/Mutiny.2026.x265.WEB-DL.2160p.HDR.mkv?link=2276bb3214b4b108b506d25284a6e120fa8e4dbc&index=1&play"
    steps:
      - uses: actions/checkout@v6

      - name: Node 24 for Electron runtime verification
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Download and verify pinned AC3/EAC3 Electron 44.4.4
        shell: pwsh
        run: ./scripts/prepare-electron.ps1

      - name: Validate regression script syntax
        run: node --check test/live-torrserver-electron.cjs

      - name: Probe both supplied 4K torrents in the real Electron main process
        timeout-minutes: 5
        run: node test/run-live-torrserver.cjs

      - name: Summarize verified media stream ranges
        if: always()
        shell: pwsh
        run: |
          $file = '.cache/live-torrserver/report.json'
          if (!(Test-Path -LiteralPath $file)) {
            Write-Warning 'No JSON report: the Electron test did not reach media probes.'
            'No media probe results were recorded.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $report = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
          '## Real TorrServer streams (Electron 44.4.4)' >> $env:GITHUB_STEP_SUMMARY
          '| Stream | Result | Checks | AC3/EAC3 marker in header |' >> $env:GITHUB_STEP_SUMMARY
          '| --- | --- | --- | --- |' >> $env:GITHUB_STEP_SUMMARY
          foreach ($entry in $report.streams) {
            $state = if ($entry.passed) { 'PASS' } else { 'FAIL' }
            $codec = if ($null -eq $entry.ac3MarkerPresent) { 'not asserted' } elseif ($entry.ac3MarkerPresent) { 'found' } else { 'not found in first 512 KiB' }
            $count = @($entry.checks).Count
            "| $($entry.label) | $state | $count | $codec |" >> $env:GITHUB_STEP_SUMMARY
            Write-Host "$state — $($entry.label), $count checks; audio marker: $codec"
            foreach ($check in $entry.checks) {
              Write-Host "  $($check.test): HTTP $($check.status), bytes=$($check.bytes)$($check.received)"
            }
            if ($entry.error) { Write-Warning $entry.error }
          }

      - name: Upload bounded diagnostic report even if the torrent is unavailable
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-torrserver-electron-4k-report
          if-no-files-found: warn
          path: .cache/live-torrserver/report.json
