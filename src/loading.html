<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lampa — подключение</title>
<style>
* {box-sizing:border-box}
body {margin:0;background:#111315;color:#ededed;min-height:100vh;display:grid;place-items:center;font:17px/1.5 "Segoe UI",system-ui,sans-serif}
main {width:min(90%,600px);text-align:center;padding:28px}
.spinner {height:44px;width:44px;margin:0 auto 28px;border-radius:50%;border:4px solid #40484a;border-top-color:#00c8bb;animation:spin .85s linear infinite}
h1 {color:#00c8bb;font-size:25px;font-weight:600;margin:0 0 12px}
p {overflow-wrap:anywhere;margin:0 0 12px;color:#e4e4e4}
small {color:#929ca1}
@keyframes spin {to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body><main><div class="spinner" aria-hidden="true"></div><h1>Пробуем открыть сервер</h1><p id="address"></p><small>Проверяем соединение и загружаем Lampa…</small></main>
<script>
const address=new URLSearchParams(location.search).get("url")||"";
document.getElementById("address").textContent=address;
</script>
</body></html>
