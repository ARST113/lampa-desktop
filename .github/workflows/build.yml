name: Build Lampa Windows x64 AC3-EAC3

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified installer to a GitHub prerelease
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - "v*-ac3.*"

permissions:
  contents: write

concurrency:
  group: lampa-windows-ac3-eac3-fallback
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.9.4 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check application JavaScript
        run: yarn exec eslint src scripts/verify-electron.cjs

      - name: Test application updates and subtitles
        run: node --test test/autoUpdater.test.cjs test/portablePaths.test.cjs test/pageNavigation.test.cjs test/branding.test.cjs test/subtitles.test.cjs test/matroska.test.cjs

      - name: Diagnose two new test formatting differences
        shell: pwsh
        run: |
          yarn exec prettier test/navigation-recovery-electron.cjs test/pageNavigation.test.cjs --write
          git diff -- test/navigation-recovery-electron.cjs test/pageNavigation.test.cjs

      - name: Check changed file formatting
        run: yarn exec prettier package.json build/subtitle-tools.json scripts/verify-electron.cjs test/run-subtitle-integration.cjs .github/workflows/build.yml src/main.js src/modules/portablePaths.js src/modules/navigationFallback.js src/modules/pageNavigation.js src/modules/pluginHandler.js src/modules/ipcHandlers/windowHandlers.js src/modules/ipcHandlers/storeHandlers.js src/modules/ipcHandlers/settingsHandlers.js src/modules/torrServerManager.js src/modules/autoUpdater.js src/modules/windowManager.js src/modules/ipcHandlers/otherHandlers.js src/modules/ipcHandlers/subtitleHandlers.js src/modules/ipcHandlers/index.js src/modules/subtitleExtractor.js src/modules/matroskaSubtitles.js src/modules/subtitleStream.js src/modules/playerOptionsInterceptor.js src/modules/pluginHandler.js src/subtitleBridge.js src/preload.js src/plugin.js test/*.cjs README.md --check

      - name: Download and verify custom Electron
        shell: pwsh
        run: ./scripts/prepare-electron.ps1

      - name: Prepare verified subtitle extraction tool
        shell: pwsh
        run: ./scripts/prepare-subtitle-tools.ps1

      - name: Test real subtitle playback and seeking
        run: node test/run-subtitle-integration.cjs

      - name: Package Windows x64 installer and portable executable
        run: yarn build-win

      - name: Verify packaged runtime and installer
        id: verify
        shell: pwsh
        run: |
          node scripts/verify-electron.cjs dist/win-unpacked/Lampa.exe dist/win-unpacked/ffmpeg.dll
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime verification failed.' }
          if (!(Test-Path -LiteralPath 'dist/win-unpacked/resources/app.asar')) { throw 'Missing packaged application.' }
          $subtitleTools = Get-Content build/subtitle-tools.json -Raw | ConvertFrom-Json
          $subtitleHash = (Get-FileHash -LiteralPath 'dist/win-unpacked/resources/subtitle-tools/ffmpeg.exe' -Algorithm SHA256).Hash
          if ($subtitleHash -ne $subtitleTools.executableSha256) { throw 'Packaged subtitle tool checksum mismatch.' }
          $probeHash = (Get-FileHash -LiteralPath 'dist/win-unpacked/resources/subtitle-tools/ffprobe.exe' -Algorithm SHA256).Hash
          if ($probeHash -ne $subtitleTools.probeSha256) { throw 'Packaged subtitle probe checksum mismatch.' }
          foreach ($notice in $subtitleTools.notices) {
            $noticeHash = (Get-FileHash -LiteralPath (Join-Path 'dist/win-unpacked/resources/subtitle-tools' $notice.file) -Algorithm SHA256).Hash
            if ($noticeHash -ne $notice.sha256) { throw 'Packaged subtitle notice checksum mismatch.' }
          }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag and package version differ.' }
          $installer = Get-Item -LiteralPath "dist/lampa-x64-$($package.version).exe"
          if ($installer.Length -lt 10MB) { throw 'Installer is unexpectedly small.' }
          $portableExe = Get-Item -LiteralPath "dist/lampa-portable-x64-$($package.version).exe"
          if ($portableExe.Length -lt 10MB) { throw 'Portable EXE is unexpectedly small.' }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          Get-ChildItem -Path dist/*.exe,dist/*.blockmap,dist/ac3.yml | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath dist/SHASUMS256.txt -Encoding utf8

      - name: Install and launch the standard Windows EXE
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1

      - name: Upload Windows installers and portable EXE
        uses: actions/upload-artifact@v6
        with:
          name: lampa-windows-x64-ac3-eac3
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/ac3.yml
            dist/SHASUMS256.txt

      - name: Publish verified installer
        if: github.event_name == 'push' || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lampa ${{ steps.verify.outputs.tag }} — Windows x64 AC3/EAC3 + Portable
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            New in ac3.13: fixes two competing Lampa URL navigations from
            store.onDidChange and the automatic fallback controller. All
            settings changes now navigate once, via the controller. The app
            waits for Lampa appready and visible UI structure before showing
            the window, rather than accepting a partially loaded JS global.
            Electron tests exercise changes via the actual settings IPC,
            including typo fallback, then entering a valid URL.

            New in ac3.12: invalid, unreachable or blank custom addresses
            automatically fall back to http://lampa.mx and reset the saved URL.
            The main window is hidden during startup to avoid a white screen.
            If even the default cannot load, a native Retry or Exit dialog appears.

            New in ac3.11: Windows ZIP variant removed. Retains only portable EXE and NSIS installer.
            Each release now runs the silent NSIS installer and opens its actual Lampa.exe
            with a clean profile against a deterministic local HTTP page before publication.

            Windows x64 build of Lampa Desktop using custom Electron 44.4.4 with AC3/EAC3 build flags.

            Enables embedded audio-track switching in the internal player, including torrents played through TorrServer.
            Adds App settings → Check for updates, with background downloads and installation after confirmation.

            New in ac3.10: fixes blank screens on failed URLs with a standalone error page,
            restores URL switching from that page, and permits same-site navigation.
            The Windows CI now exercises network failure and recovery in real Electron.

            New in ac3.9: removes the original developer donation menu, embedded payment QR codes,
            and Robokassa payment URLs from all Windows builds. About now links to the ARST113 fork
            and checks this fork's latest release (including prereleases).
            The original GPL license and source attribution remain available in the repository.

            New in ac3.7: fixes subtitles disappearing when Lampa changes its in-page history/hash route while playback continues.
            The subtitle subscription now stays active until the player closes or the document actually changes.
            Reads embedded text subtitle packets directly from the MKV bytes already fetched by the video player.
            Already buffered languages switch immediately without launching FFmpeg or a second media download.
            On a seek into a long caption, uses the MKV subtitle index for a bounded byte-range lookup. Files without a subtitle index resume captions from the next received packet.
            Opens developer tools with F12, Ctrl+Shift+I, or App settings → Open console.
            Supports embedded MKV text subtitles (SRT, ASS/SSA, WebVTT) in the internal player through TorrServer, including compatibility with Lampac Tracks menus.
            Discovers subtitle tracks from the MKV header, independently of TorrServer FFprobe metadata.
            Supports language switching, seeking and disabling subtitles. Video and audio are not transcoded.
            Graphical PGS/VobSub tracks are unsupported by this reader; complex ASS styling is converted to WebVTT text.

            Based on Kolovatoff/lampa-desktop. Updates for this build use ARST113/lampa-desktop.
            Runtime: https://github.com/ARST113/electron/releases/tag/v44.4.4-ac3-eac3
            The build verifies the NSIS installation and real app startup, packaged Electron version and unchanged custom ffmpeg.dll.

            Windows download choices:
            - `lampa-portable-x64-*.exe` — standalone portable launcher, no installation.
            - `lampa-x64-*.exe` — standard NSIS installer, checked by actual installation and launch.

            Portable settings, Chromium profile, and TorrServer data are stored in the LampaData
            directory next to the portable EXE. Keep this directory when replacing the portable EXE.
            Portable EXE uses manual application updates; installed EXE supports automatic updates.
            SHA-256 checksums are in SHASUMS256.txt.
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/ac3.yml
            dist/SHASUMS256.txt
