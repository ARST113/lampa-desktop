name: Build Lampa Windows x64 AC3-EAC3

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified installer to a GitHub prerelease
        type: boolean
        default: true
  push:
    tags:
      - "v*-ac3.*"

permissions:
  contents: write

concurrency:
  group: lampa-windows-ac3-eac3
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.9.4 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check application JavaScript
        run: yarn exec eslint src scripts/verify-electron.cjs

      - name: Check changed file formatting
        run: yarn exec prettier package.json scripts/verify-electron.cjs .github/workflows/build.yml src/modules/autoUpdater.js README.md --check

      - name: Download and verify custom Electron
        shell: pwsh
        run: ./scripts/prepare-electron.ps1

      - name: Package Windows x64 installer
        run: yarn build-win

      - name: Verify packaged runtime and installer
        id: verify
        shell: pwsh
        run: |
          node scripts/verify-electron.cjs dist/win-unpacked/Lampa.exe dist/win-unpacked/ffmpeg.dll
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime verification failed.' }
          if (!(Test-Path -LiteralPath 'dist/win-unpacked/resources/app.asar')) { throw 'Missing packaged application.' }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag and package version differ.' }
          $installer = Get-Item -LiteralPath "dist/lampa-x64-$($package.version).exe"
          if ($installer.Length -lt 10MB) { throw 'Installer is unexpectedly small.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Get-ChildItem -Path dist/*.exe,dist/*.blockmap,dist/ac3.yml | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath dist/SHASUMS256.txt -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: lampa-windows-x64-ac3-eac3
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/ac3.yml
            dist/SHASUMS256.txt

      - name: Publish verified installer
        if: github.event_name == 'push' || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lampa ${{ steps.verify.outputs.tag }} — Windows x64 AC3/EAC3
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Windows x64 build of Lampa Desktop using custom Electron 44.4.4 with AC3/EAC3 build flags.

            Based on Kolovatoff/lampa-desktop. Updates for this build use ARST113/lampa-desktop.
            Runtime: https://github.com/ARST113/electron/releases/tag/v44.4.4-ac3-eac3
            The build verifies the ZIP checksum, packaged Electron version and unchanged custom ffmpeg.dll.

            Download the `.exe` installer below. SHA-256 checksums are in SHASUMS256.txt.
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/ac3.yml
            dist/SHASUMS256.txt
