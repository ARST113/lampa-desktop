name: Build Lampa macOS AC3-EAC3

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish verified DMG and ZIP files to the shared release
        type: boolean
        default: true
      release_tag:
        description: Existing shared Lampa release
        type: string
        default: v1.6.0-ac3.24

permissions:
  contents: write

concurrency:
  group: lampa-macos-ac3-eac3
  cancel-in-progress: false

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            builder_arch: x64
            native_arch: x64
            app_dir: mac
          - arch: arm64
            runner: macos-15
            builder_arch: arm64
            native_arch: arm64
            app_dir: mac-arm64
          - arch: universal
            runner: macos-15
            builder_arch: x64
            native_arch: arm64
            app_dir: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ELECTRON_OVERRIDE_DIST_PATH: ${{ github.workspace }}/.cache/electron-macos-${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_FOR_PULL_REQUEST: "true"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pinned Yarn and dependencies
        run: |
          corepack enable
          corepack prepare yarn@4.9.4 --activate
          yarn install --immutable

      - name: Verify JavaScript and unit tests
        run: |
          yarn exec eslint src scripts/prepare-macos.cjs scripts/verify-macos-package.cjs test/torrserver-cancellation-electron.cjs test/undici-electron-net.cjs
          node --test test/*.test.cjs
          yarn exec prettier package.json build/electron-runtime-macos.json scripts/prepare-macos.cjs scripts/verify-macos-package.cjs .github/workflows/build.yml src/modules/electronNetFetch.js src/modules/playerOptionsInterceptor.js src/modules/subtitleStream.js src/modules/torrServerManager.js src/modules/ipcHandlers/cloudHandlers.js test/torrserver-cancellation-electron.cjs test/undici-electron-net.cjs --check

      - name: Download and verify existing custom runtime and subtitle tools
        run: node scripts/prepare-macos.cjs "${{ matrix.arch }}"

      - name: Test real Electron network requests on the native architecture
        run: |
          test "$(node -p process.arch)" = "${{ matrix.native_arch }}"
          runtime="$PWD/.cache/electron-macos-${{ matrix.arch }}/Electron.app/Contents/MacOS/Electron"
          "$runtime" test/undici-electron-net.cjs 2>&1 | tee ".cache/undici-electron-net-${{ matrix.arch }}.log"
          "$runtime" test/torrserver-cancellation-electron.cjs 2>&1 | tee ".cache/torrserver-cancellation-${{ matrix.arch }}.log"

      - name: Package and sign the application bundle
        run: |
          yarn exec electron-builder --mac --${{ matrix.builder_arch }} --dir --publish=never --config .cache/electron-builder-macos.json
          node scripts/verify-macos-package.cjs sign "${{ matrix.arch }}"

      - name: Create DMG and ZIP from the verified signed bundle
        run: |
          yarn exec electron-builder --mac --${{ matrix.builder_arch }} --prepackaged "$PWD/dist/${{ matrix.app_dir }}/Lampa.app" --publish=never --config .cache/electron-builder-macos.json

      - name: Verify distributable application and checksums
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          version="$(node -p 'require("./package.json").version')"
          prefix="lampa-$arch-$version-macos-ac3"
          node scripts/verify-macos-package.cjs verify "$arch"
          test -s "dist/$prefix.dmg"
          test -s "dist/$prefix.zip"
          zip_hash="$(unzip -p "dist/$prefix.zip" Lampa.app/Contents/Resources/app.asar | shasum -a 256 | cut -d ' ' -f 1)"
          app_hash="$(shasum -a 256 "dist/${{ matrix.app_dir }}/Lampa.app/Contents/Resources/app.asar" | cut -d ' ' -f 1)"
          test "$zip_hash" = "$app_hash"
          mountpoint="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "dist/$prefix.dmg"
          trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true' EXIT
          node scripts/verify-macos-package.cjs verify "$arch" "$mountpoint/Lampa.app"
          hdiutil detach "$mountpoint"
          trap - EXIT
          rmdir "$mountpoint"
          (cd dist && shasum -a 256 "$prefix.dmg" "$prefix.zip" > "SHASUMS256-macos-$arch.txt")

      - name: Upload verified macOS files and regression evidence
        uses: actions/upload-artifact@v6
        with:
          name: lampa-macos-${{ matrix.arch }}-ac3-eac3
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHASUMS256-macos-*.txt
            .cache/macos-*-provenance.json
            .cache/torrserver-cancellation-*.log
            .cache/undici-electron-net-*.log

      - name: Publish verified macOS files to the shared release
        if: inputs.publish_release
        run: |
          tag="${{ inputs.release_tag }}"
          gh release view "$tag" --repo ARST113/lampa-desktop
          gh release upload "$tag" --repo ARST113/lampa-desktop dist/*.dmg dist/*.zip dist/SHASUMS256-macos-*.txt
