name: Finalize verified Lampa Desktop release

# Replaces the old ac3.7 mirroring job. This one-time release maintenance
# changes no Windows binaries or update metadata and avoids future re-mirroring.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/consolidate-releases.yml"
      - "scripts/finalize-unified-release.cjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lampa-release-platform-consolidation
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Consolidate, verify and prune the current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/finalize-unified-release.cjs
